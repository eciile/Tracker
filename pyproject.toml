[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker-agent"
version = "0.1.0"
description = "A learning-first repository investigation agent"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Tracker contributors"}]

[project.scripts]
tracker = "tracker.cli:main"

[tool.setuptools]
packages = ["tracker"]
